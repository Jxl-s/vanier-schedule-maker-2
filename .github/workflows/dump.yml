name: Dump and Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run dump script
        run: |
          node ./dump-teachers.js
          node ./dump-courses.js ${{ secrets.FORM }}

      - name: Check latest commit author
        id: check_commit
        run: |
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          if [[ "$LAST_AUTHOR" == "github-actions[bot]" ]]; then
            echo "amend=true" >> $GITHUB_OUTPUT
          else
            echo "amend=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        run: |
          git add dump-courses.json dump-teachers.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.check_commit.outputs.amend }}" = "true" ]; then
            git commit --amend --no-edit
            git push --force-with-lease
          else
            git commit -m "Automated dump update"
            git push
          fi
